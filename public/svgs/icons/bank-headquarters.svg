  <rect x="8" y="17" width="32" height="3.5" rx="1" fill="#73A7C1" stroke="#1A2754" stroke-width="1.5"/>
  <!-- 4 Classical Pillars -->
  <rect x="10" y="20.5" width="4.5" height="15" rx="1" stroke="#1A2754" stroke-width="2"/>
  <rect x="18" y="20.5" width="4.5" height="15" rx="1" stroke="#1A2754" stroke-width="2"/>
  <rect x="25.5" y="20.5" width="4.5" height="15" rx="1" stroke="#1A2754" stroke-width="2"/>
  <rect x="33.5" y="20.5" width="4.5" height="15" rx="1" stroke="#1A2754" stroke-width="2"/>
  <!-- Stepped Foundation -->
  <rect x="6" y="35.5" width="36" height="3" rx="0.5" fill="#73A7C1" stroke="#1A2754" stroke-width="1.5"/>
  <rect x="4" y="38.5" width="40" height="3.5" rx="1" fill="#1A2754"/>
</svg>
