<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer Compass Dial -->
  <circle cx="24" cy="24" r="20" stroke="#1A2754" stroke-width="2.5"/>
  <!-- Degree Tick Markers -->
  <line x1="24" y1="5" x2="24" y2="8" stroke="#1A2754" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="24" y2="43" stroke="#1A2754" stroke-width="2" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="8" y2="24" stroke="#1A2754" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="43" y2="24" stroke="#1A2754" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Precision Navigational Needle -->
  <polygon points="24,10 28,24 24,21 20,24" fill="#73A7C1" stroke="#1A2754" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="24,38 28,24 24,27 20,24" stroke="#1A2754" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Center Pivot -->
  <circle cx="24" cy="24" r="2.5" fill="#1A2754"/>
</svg>
